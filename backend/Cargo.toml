[package]
name = "streamhive"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
authors = ["Johpaz/StreamHive contributors"]

[dependencies]
axum = { version = "=0.8.9", features = ["macros"] }
tokio = { version = "=1.53.3", features = ["full"] }
tower-http = { version = "=0.6.11", features = ["fs", "trace", "limit", "set-header"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
jsonwebtoken = "=9.3.1"
argon2 = "=0.5.3"
aes-gcm = "=0.10.3"
rand = "=0.8.8"
base64 = "=0.22.1"
sha2 = "=0.10.9"
uuid = { version = "=1.27.0", features = ["v4", "serde"] }
fs2 = "=0.4.3"
anyhow = "=1.0.104"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
url = "=2.5.8"

tower = { version = "=0.5.3", features = ["util"] }

tokio-tungstenite = { version = "=0.28.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "=0.3.34"
hyper = "=1.12.0"
hyper-util = { version = "=0.1.21", features = ["tokio"] }
sysinfo = { version = "=0.40.1", default-features = false, features = ["system"] }
rcgen = "=0.13.2"
axum-server = { version = "=0.8.0", features = ["tls-rustls"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
time = { version = "=0.3.55", default-features = false, features = ["std"] }

[dev-dependencies]
streamhive-sessions = { path = "../sessions" }
http-body-util = "=0.1.5"
