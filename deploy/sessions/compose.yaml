# Servidor de sesiones remotas de StreamHive detrás de un Traefik existente.
# Un solo archivo: cópialo al servidor junto a un .env (ver .env.example) y ejecuta
#
#   docker compose -f compose.yaml --env-file .env up -d
#
# Actualizar a otra versión: cambia SESSIONS_TAG en .env y repite `pull` + `up -d`.
#
# Además de HTTPS (Traefik), abre en el firewall del VPS los puertos de cámara y audio:
# ${MEDIA_UDP_PORT:-7882}/udp y ${MEDIA_TCP_PORT:-7881}/tcp. No pasan por Traefik (WebRTC).
name: ${COMPOSE_PROJECT_NAME:-streamhive-sessions}

x-sessions-image: &sessions-image
  image: ${SESSIONS_IMAGE:-johpaz/streamhive-sessions}:${SESSIONS_TAG:-0.2.0}

x-hardening: &hardening
  user: "1000:1000"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=64M,mode=1777"]
  pids_limit: 128

x-env: &env
  PUBLIC_URL: https://${SESSIONS_DOMAIN:?Pon SESSIONS_DOMAIN en .env}
  DATA_DIR: /data
  LISTEN_ADDR: 0.0.0.0:8080
  RUST_LOG: ${RUST_LOG:-streamhive_sessions=info}
  # Cámara y audio: LiveKit de este compose, solo accesible a través de este servicio (/lk).
  LIVEKIT_URL: http://livekit:7880
  MEDIA_DIR: /media
  MEDIA_UDP_PORT: ${MEDIA_UDP_PORT:-7882}
  MEDIA_TCP_PORT: ${MEDIA_TCP_PORT:-7881}
  # Vacío: LiveKit descubre la IP pública del VPS. Ponla si el VPS tiene varias.
  MEDIA_PUBLIC_IP: ${MEDIA_PUBLIC_IP:-}

x-logging: &logging
  logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

services:
  # Crea o actualiza el esquema de SQLite y prepara LiveKit (claves propias la primera vez)
  # antes de arrancar el servidor.
  sessions-migrate:
    <<: [*sessions-image, *hardening, *logging]
    container_name: streamhive-sessions-migrate
    restart: "no"
    command: ["migrate"]
    environment: *env
    volumes: ["sessions-data:/data", "media-config:/media"]
    networks: [backend]
    mem_limit: 128m
    cpus: 0.5
    healthcheck: { disable: true }

  sessions:
    <<: [*sessions-image, *hardening, *logging]
    container_name: streamhive-sessions
    restart: unless-stopped
    stop_grace_period: 30s
    expose: ["8080"]
    mem_limit: ${SESSIONS_MEMORY_LIMIT:-384m}
    cpus: ${SESSIONS_CPU_LIMIT:-0.5}
    environment:
      <<: *env
      TRUST_PROXY: "true"
      REGISTRATIONS_PER_HOUR: ${REGISTRATIONS_PER_HOUR:-120}
      REQUESTS_PER_MINUTE: ${REQUESTS_PER_MINUTE:-600}
      MAX_CONNECTIONS: ${MAX_CONNECTIONS:-1000}
    volumes: ["sessions-data:/data", "media-config:/media:ro"]
    depends_on:
      sessions-migrate: { condition: service_completed_successfully }
    networks:
      - backend
      - traefik-proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_evoapi
      - traefik.http.routers.streamhive-sessions.rule=Host(`${SESSIONS_DOMAIN}`)
      - traefik.http.routers.streamhive-sessions.entrypoints=websecure
      - traefik.http.routers.streamhive-sessions.tls=true
      - traefik.http.routers.streamhive-sessions.tls.certresolver=mytlschallenge
      - traefik.http.routers.streamhive-sessions.middlewares=streamhive-sessions-headers@docker
      - traefik.http.middlewares.streamhive-sessions-headers.headers.SSLRedirect=true
      - traefik.http.middlewares.streamhive-sessions-headers.headers.STSSeconds=315360000
      - traefik.http.services.streamhive-sessions.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD", "streamhive-sessions", "healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5

  # Cámara y audio de anfitriones e invitados. Señalización por el servicio de sesiones;
  # el vídeo, directo a los puertos publicados (UDP, o TCP si la red del invitado bloquea UDP).
  livekit:
    image: docker.io/livekit/livekit-server:v1.13.11@sha256:25cd902de7cacbd5f1f779f6a6ac1eae20ba8f56b0935934ce6b0ab80d1e3d20
    container_name: streamhive-livekit
    <<: [*hardening, *logging]
    pids_limit: 512
    restart: unless-stopped
    command: ["--config", "/media/livekit.yaml"]
    volumes: ["media-config:/media:ro"]
    ports:
      - "${MEDIA_UDP_PORT:-7882}:${MEDIA_UDP_PORT:-7882}/udp"
      - "${MEDIA_TCP_PORT:-7881}:${MEDIA_TCP_PORT:-7881}/tcp"
    mem_limit: ${MEDIA_MEMORY_LIMIT:-1g}
    cpus: ${MEDIA_CPU_LIMIT:-1.5}
    networks: [backend]
    depends_on:
      sessions-migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7880/"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

networks:
  backend:
  traefik-proxy:
    external: true
    name: n8n_evoapi

volumes:
  sessions-data:
  media-config:
