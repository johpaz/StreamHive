name: sessions-image
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Push image to Docker Hub
        type: boolean
        default: false
  push:
    tags: ["sessions-v*"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.3 }
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install --cwd frontend --frozen-lockfile
      - run: bun scripts/build-session-guest.mjs
      - run: cargo test --locked -p streamhive-sessions
      - run: bun run --cwd frontend build
  image:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/sessions-v') || inputs.publish
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: johpaz/streamhive-sessions
          tags: |
            type=match,pattern=sessions-v(.*),group=1
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: sessions/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/sessions-v') || inputs.publish }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
